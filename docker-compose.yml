services:
  easm-web:
    build: .
    container_name: passive-easm-web
    command: ["uvicorn", "src.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    restart: unless-stopped

  easm-monitor:
    build: .
    container_name: passive-easm-cli
    profiles: ["cli"]
    entrypoint: ["python", "-m", "src.main"]
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    restart: "no"
