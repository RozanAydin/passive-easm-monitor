<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Passive EASM &amp; Brand Threat Monitor{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            socbg: '#0b1120',
            socpanel: '#111827',
            socborder: '#1f2937',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-socbg text-slate-200 min-h-screen flex flex-col antialiased">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-bold text-sm">
          CTI
        </span>
        <div>
          <div class="text-sm font-semibold text-white group-hover:text-emerald-400 transition">
            Passive EASM &amp; Brand Threat Monitor
          </div>
          <div class="text-xs text-slate-400">100% Passive OSINT Reconnaissance &amp; Delta Engine</div>
        </div>
      </a>
      <nav class="flex items-center gap-4 text-xs">
        <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/10 px-3 py-1 text-emerald-400 border border-emerald-500/20">
          <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
          Passive Mode Only
        </span>
        <a href="/" class="text-slate-300 hover:text-white transition font-medium">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
    Authorized passive OSINT monitoring only. All external queries are rate-limited and WHOIS/RDAP PII is redacted.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
